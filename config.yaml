# config.yaml — The Edge. Edit sources + interests below.
# Required: briefing, filter, sources. Optional extensions are documented in
# config.example.yaml and default to off.
briefing:
  title: "The Edge"

filter:
  # claude_curate: the day's biggest AI stories first, plus anything touching the
  # interests below. (interests mode keeps ONLY interest matches; too narrow here.)
  # Khare relevance is then layered on top by the priority labels further down.
  mode: claude_curate      # interests | recent | per_source_cap | claude_curate
  interests:
    - "AI for private capital: deal screening, due diligence, portfolio and loan monitoring tools"
    - "verifiable, governed AI: citations, claim verification, audit trails, human approval"
    - "AI agents and AI engineering: frameworks, tooling, production deployment"
    - "frontier model releases, capabilities and research breakthroughs"
    - "AI in banking, wealth management, payments and capital markets"
    - "fintech and AI startups in Switzerland and Europe, funding and M&A"
    - "EU AI Act, AI regulation, policy and governance"
    - "AI's impact on work, organisations and society"
  max_items: 25
  min_score: 50            # interests mode: keep stories Claude scores at least this (0-100)
  per_source_cap: 5
  # 48h rather than 24h: history.json stops repeats, and the wider window
  # catches weekly letters and anything a late or failed run missed.
  recency_hours: 48

sources:
  # ── Frontier tech & AI engineering (daily triage + deep dives) ──
  - { type: rss, name: "TLDR AI",          url: "https://tldr.tech/api/rss/ai", timeout: 60 }  # slow host
  - { type: rss, name: "The Rundown AI",   url: "https://rss.beehiiv.com/feeds/2R3C6Bt5wj.xml" }
  - { type: rss, name: "AINews (smol.ai)", url: "https://news.smol.ai/rss.xml" }
  - { type: rss, name: "Latent Space",     url: "https://www.latent.space/feed" }
  - { type: rss, name: "Import AI",        url: "https://jack-clark.net/feed/" }  # same posts as importai.substack.com, which blocks GitHub
  - { type: rss, name: "AlphaSignal",      url: "https://alphasignal.ai/feed.xml" }
  - { type: rss, name: "Simon Willison",   url: "https://simonwillison.net/atom/entries/" }
  - { type: rss, name: "LangChain Blog",   url: "https://blog.langchain.com/rss.xml" }
  - { type: rss, name: "Hugging Face Blog", url: "https://huggingface.co/blog/feed.xml" }
  - { type: rss, name: "OpenAI News",      url: "https://openai.com/news/rss.xml" }

  # ── AI in finance, fintech & European startups ──
  # - { type: rss, name: "The FinTech Blueprint", url: "https://lex.substack.com/feed" }  # Substack blocks GitHub's servers, relays too; no mirror feed. Try claude_fetch if wanted.
  - { type: rss, name: "Fintechnews Switzerland", url: "https://fintechnews.ch/feed/" }
  - { type: rss, name: "Sifted",           url: "https://sifted.eu/feed" }

  # ── Private capital: VC, private equity & fund operations (Khare's buyers) ──
  - { type: rss, name: "Venture Capital Journal",      url: "https://www.venturecapitaljournal.com/feed/" }
  - { type: rss, name: "Private Equity International", url: "https://www.privateequityinternational.com/feed/" }
  - { type: rss, name: "Private Funds CFO",            url: "https://www.privatefundscfo.com/feed/" }  # fund ops, compliance, reporting
  - { type: rss, name: "Tech.eu",                      url: "https://tech.eu/feed/" }                  # European startup funding
  # Also checked: Private Debt Investor (feed returns no items), PitchBook (403),
  # Institutional Investor / Unquote / Real Deals (no public feed), AltFi (empty).

  # ── Society, work & platform power ──
  - { type: rss, name: "One Useful Thing", url: "https://www.oneusefulthing.org/feed" }
  - { type: rss, name: "Platformer",       url: "https://www.platformer.news/rss/" }
  - { type: rss, name: "MIT Technology Review AI", url: "https://www.technologyreview.com/topic/artificial-intelligence/feed" }
  - { type: rss, name: "Rest of World",    url: "https://restofworld.org/feed/latest/" }

  # Tested, but left out to keep the mix tight. Uncomment to add:
  # - { type: rss, name: "The Neuron",       url: "https://rss.beehiiv.com/feeds/N4eCstxvgX.xml" }  # overlaps The Rundown
  # - { type: rss, name: "Techmeme",         url: "https://www.techmeme.com/feed.xml" }             # all of tech, noisy
  # - { type: rss, name: "TechCrunch AI",    url: "https://techcrunch.com/category/artificial-intelligence/feed/" }
  # - { type: rss, name: "Stratechery",      url: "https://stratechery.com/feed/" }                 # mostly paywalled
  # - { type: rss, name: "Crunchbase News",  url: "https://news.crunchbase.com/feed/" }
  # - { type: rss, name: "McKinsey Insights", url: "https://www.mckinsey.com/insights/rss" }        # broad, not AI-only
  # No working public feed (email-only, paywalled, or blocked): The Batch, Evident
  # Insights (The Brief), WatersTechnology, Risk.net, Fintech Brainfood, Garbage Day,
  # Tech Policy Press (feed times out). claude_fetch can cover one if you need it.

email:
  mode: cover              # triage email: day in 30 seconds, reading order, skim headlines + link to the web edition
  from_name: "The Edge"    # sender name shown in Gmail
  unsubscribe: sender      # footer Unsubscribe = a mailto: to the sending account (kept in Secrets, not here)
  feedback: sender         # "Useful / Not for us" under each reading-order story, emailed to the sending account

# Reading priority: labels every item "Read first", "Read today" or "Later"
# for Khare, and puts a "Read first today" list at the top of each edition.
# Distilled from the North Star (v3, 2026-09-19). This repo and the web
# edition are PUBLIC, so this deliberately leaves out clients, pricing,
# revenue, fundraising and anything else internal.
priority:
  enabled: true
  org: "Khare"
  max_first: 3
  context: |
    Khare Automations builds AI screening software for private capital. It turns a
    pitch deck into a verified, decision-ready profile and verdict: every claim is
    checked against independent sources, carries a status, and a named reviewer
    approves every output. Khare never decides and never sends. It deploys hosted or
    into the client's own cloud tenant. The long-term aim is to own the record of
    what a fund decided, on what evidence, and how it turned out.
    Next surface (planned, not built): downside monitoring for venture-debt lenders:
    runway against burn, debt at cash-out, collateral coverage, threshold alerts and
    pre-funding material-adverse-change checks.
    Buyers: five to thirty person European VC funds, venture-debt lenders and family
    offices that must defend every decision and cannot buy an enterprise platform.
    Competitors and adjacent players: Intapp DealCloud and Celeste, Hebbia, V7 Go,
    Affinity, Harmonic, Visible.vc, Rundit, Carta, Allvue, Juniper Square and
    loan-monitoring vendors. Standalone deck extraction is commoditised (Deckmatch
    wound down in September 2026).
    Matters most: competitor launches, funding and moves down-market; AI adoption by
    VCs, private credit and venture-debt lenders; verification, citations, audit
    trails and evals for AI; agent reliability; data security and single-tenant
    deployment; AI regulation touching finance (EU AI Act, FCA, FINMA); Swiss and
    European startup funding programmes.
    Not relevant: LP and quarterly reporting tools, consumer AI, crypto trading.

# "The day in 30 seconds": three takeaways at the top of the email and web edition.
summary: { enabled: true }

# Preview images: each story's og:image (what link previews show), hotlinked.
images: { enabled: true }

web: { enabled: true, output_dir: "docs", edition_url: "https://khare-automations.github.io/ai_newsletter/" }

# Fixed archive topics: every story gets one (in the priority call) so the
# Archive can filter by category across days. Stories that fit none show as "Other".
archive:
  topics:
    - "Frontier models"
    - "Agents & engineering"
    - "Governed AI"
    - "AI in private capital"
    - "AI in finance"
    - "Regulation & policy"
    - "Startups & funding"
    - "Work & society"

# Weekdays only. Friday's edition is the "Week in 5": the week's five most
# important stories (Mon-Thu reading orders + Friday's news) with "The week
# in 30 seconds"; Friday's other stories run as the skim list.
schedule:
  weekly_day: friday
  weekly_picks: 5
  skip_weekends: true

# Optional extensions (uncomment to enable — see config.example.yaml for docs):
# voice:    { enabled: true, name: "Your editor's name", tone: "warm, cozy, slightly witty" }  # invent your own — see README
