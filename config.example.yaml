# config.example.yaml — copy to config.yaml and edit.
# Only `briefing`, `filter`, and `sources` are required. Everything below
# `sources` is optional and defaults to "off", so a minimal config still ships
# a plain themed email.
briefing:
  title: "My Daily Briefing"

filter:
  mode: interests          # interests | recent | per_source_cap | claude_curate
  interests:
    - "AI policy in Europe"
    - "longevity research"
  max_items: 25
  min_score: 50            # interests mode: keep stories scoring at least this (0-100); lower for fuller editions
  per_source_cap: 5
  recency_hours: 24

sources:
  - { type: rss,  name: "BBC World", url: "http://feeds.bbci.co.uk/news/world/rss.xml" }
  - { type: site, name: "Seedcamp", module: "seedcamp" }
  # - { type: rss,  name: "Atlas Obscura", url: "https://atlasobscura.com/feeds/latest", proxy: true }  # proxy: true routes bot-blocked feeds through a relay
  # - { type: rss,  name: "Slow Feed", url: "https://example.com/rss", timeout: 60 }  # seconds; default 30
  # - { type: scrape, name: "Static Site", url: "https://example.com/news",
  #     item_selector: ".post", title_selector: "h2 a", link_selector: "h2 a" }
  # - { type: claude_fetch, name: "No-Feed Site", url: "https://example.com" }
  # - { type: youtube, name: "Veritasium", channel_id: "UCxxxx" }   # add skip_shorts: true to drop Shorts

# ── Optional extensions ───────────────────────────────────────────────────────

# email.mode: "full" (default) sends the whole briefing in the email.
# "cover" sends a short triage cover: the day in 30 seconds (with `summary`),
# a numbered reading order with read times, a few headlines per section and a
# button to the web edition — pair it with `web.enabled: true` below.
# email.unsubscribe (a URL or mailto:) and email.address (a postal line) add
# footer lines to the cover; both are blank by default.
# email.subject: "date" (default) -> "My Daily Briefing - Sep 24, 2026".
# "top_pick" -> "My Daily Briefing | <lead headline>", which gets more opens.
# email.from_name: the sender name the inbox shows (e.g. "The Edge"); blank
# shows the sending account's own name.
# email:
#   mode: cover
#   subject: top_pick
#   from_name: "The Edge"
#   unsubscribe: sender   # a mailto: to EMAIL_SENDER; or any URL / "mailto:you@example.com?subject=Unsubscribe"
#   address: "Acme Ltd · 1 Example Street, Zurich"
#   feedback: sender      # adds "Useful / Not for us" links (mailto:) under each reading-order story

# summary: "The day in 30 seconds": three one-line takeaways at the top of the
# cover email and the web edition, each linking to the story or section that
# backs it. One extra Claude call; fails soft (no summary) on any error.
# summary: { enabled: true }

# explain: "Explain it simply", an ELI5 box: Claude picks the one concept in
# the day's reading order a newcomer would most need explained (RAG, MCP,
# venture debt, ...) and explains it in 3-4 emoji steps plus a line on why it
# matters today. Web edition (between the reading order and Skim) and cover
# email. Concepts from the last 20 editions are not repeated. One extra Claude
# call; fails soft (no box) on any error or when nothing needs explaining.
# explain: { enabled: true }

# voice: give your briefing an AI editor persona — entirely yours to invent.
# When enabled it writes a short daily greeting and names the themes in that
# voice. `name` signs the greeting; `tone` is the prompt that steers the style
# (a few descriptive adjectives work best — see the README "editor voice"
# section for how to craft it and more examples). Needs ANTHROPIC_API_KEY;
# fails soft (no greeting) if the call errors.
# voice:
#   enabled: true
#   name: "Your editor's name"          # e.g. a persona you make up
#   tone: "warm, cozy, slightly witty"  # describe personality + writing style

# priority: label each item "Read first", "Read today" or "Later" for your
# team, with a one-line "why it matters", and open each edition with a "Read
# first today" list. `context` is a short profile of your company: what you
# build, who buys it, who you compete with, what matters. It's sent to Claude
# and shapes the "why" lines, which appear in the email and web edition, so keep
# it to what you're comfortable publishing if your repo or site is public.
# The same call folds duplicate coverage of one event into a single entry
# ("4 sources, 1 story"). One extra Claude call per edition; fails soft (no
# labels, no clustering) on any error.
# priority:
#   enabled: true
#   org: "Acme"
#   max_first: 3         # cap on "Read first" so it stays meaningful
#   context: |
#     Acme builds ... for ... Competitors: ... Matters most: ... Not relevant: ...

# images: give each story its preview picture, the one publishers declare for
# link previews (og:image), or the image the feed already supplies. Only the
# stories that ship are looked up, in parallel; no Claude cost. Images are
# linked, not downloaded. Stories without one render text-only. The same page
# fetch measures each article for its read time ("4 min").
# images:
#   enabled: true
#   timeout: 10   # seconds per article page
#   workers: 8    # pages looked up in parallel

# web: also publish a browsable HTML "web edition" + a dated archive into
# `output_dir` (serve it with GitHub Pages — Settings → Pages → /docs).
# edition_url is the public URL, linked from a "cover" email.
# web:
#   enabled: true
#   output_dir: "docs"
#   edition_url: "https://YOURNAME.github.io/YOURREPO/"
#   reading_images: first   # pictures in the reading order: first (default) | all | none
#   skim_expanded: false    # true opens every skim headline's gist by default

# archive: the Archive page filters by fixed topics. With priority on, the
# priority call gives each story one. Default: short labels made from
# `filter.interests`; list your own to control the wording.
# archive:
#   topics: ["Frontier models", "Governed AI", "Regulation & policy"]

# editions: ship more than once a day. Listed in chronological order; each runs
# when the local hour is before its `until_hour`. The last one is the catch-all.
# Match these to the cron times in .github/workflows/daily.yml.
# editions:
#   - { key: morning, label: "Morning Edition", until_hour: 12 }
#   - { key: evening, label: "Evening Edition" }

# schedule: a weekly recap and a weekday-only rhythm. On `weekly_day` the
# edition becomes the "Week in 5": one Claude call picks the week's most
# important stories from the archive's saved editions (needs `web.enabled`)
# plus today's news, and writes "The week in 30 seconds". `skip_weekends`
# sends nothing on Saturday or Sunday. Also trim the cron in daily.yml.
# schedule:
#   weekly_day: friday
#   weekly_picks: 5
#   skip_weekends: true
