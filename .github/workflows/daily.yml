name: Daily Briefing
on:
  # No GitHub cron: a Claude routine ("AI newsletter daily briefing", 06:13
  # Zurich on weekdays) dispatches this workflow once it has checked that
  # history.json shows no edition sent today. GitHub cron can start hours
  # late, which sent a second edition on 2026-09-29.
  workflow_dispatch:        # the Claude routine, or a run by hand from the Actions tab
    inputs:
      preview_to:
        description: "Preview: send ONLY to this address, save nothing (leave blank for a real edition)"
        required: false
        default: ""
      edition:
        description: "Which edition (auto = by weekday: Friday is the Week in 5)"
        type: choice
        options: [auto, daily, weekly]
        default: auto
# One run at a time.
concurrency:
  group: daily-briefing
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Zurich     # datelines, edition filenames and AM/PM picks use local time
    permissions:
      contents: write       # needed to commit history.json + the web edition back
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt

      - name: Run briefing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}   # only for keys not scoped to one workspace
          EMAIL_SENDER:      ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD:    ${{ secrets.EMAIL_PASSWORD }}
          # optional From: address (a "Send mail as" alias of EMAIL_SENDER); blank = EMAIL_SENDER
          EMAIL_FROM:        ${{ secrets.EMAIL_FROM }}
          # one address or a comma-separated list; a preview goes only to preview_to
          EMAIL_RECIPIENT:   ${{ inputs.preview_to || secrets.EMAIL_RECIPIENT }}
          SMTP_HOST:         ${{ secrets.SMTP_HOST }}
          SMTP_PORT:         ${{ secrets.SMTP_PORT }}
          YOUTUBE_API_KEY:   ${{ secrets.YOUTUBE_API_KEY }}
          BRIEFING_EDITION:  ${{ inputs.edition || 'auto' }}
          BRIEFING_PREVIEW:  ${{ inputs.preview_to && '1' || '' }}
        run: python main.py

      # Commit history.json (so nothing repeats) and, if the web edition is
      # enabled in config.yaml, the regenerated docs/ (index + archive + dated
      # edition). Non-fatal: a successful email must never be turned red by a
      # push conflict. Operates on the current branch, so it works pre-merge.
      # Only after a successful run, so a failed send never publishes an
      # edition nobody was emailed.
      - name: Commit history + web edition
        if: success() && !inputs.preview_to
        continue-on-error: true
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f history.json ]      && git add history.json
          [ -f docs/index.html ]   && git add docs/index.html
          [ -f docs/archive.html ] && git add docs/archive.html
          [ -d docs/editions ]     && git add docs/editions/
          if git diff --cached --quiet; then
            echo "Nothing changed — nothing to commit."; exit 0
          fi
          git commit -m "chore: update history + edition [skip ci]"
          git pull --rebase -X ours origin "${GITHUB_REF_NAME}" || git rebase --abort || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || echo "::warning::history/docs push skipped"

      # OPTIONAL: publish the web edition to a SEPARATE public GitHub Pages repo
      # (keeps this repo private). Create the public repo, add a fine-grained PAT
      # with Contents:write on it as the secret EDITION_DEPLOY_TOKEN, and set
      # EDITION_REPO below to "owner/repo". Skips quietly if the secret is absent.
      - name: Publish web edition to public site
        if: success() && !inputs.preview_to
        continue-on-error: true
        env:
          EDITION_DEPLOY_TOKEN: ${{ secrets.EDITION_DEPLOY_TOKEN }}
          EDITION_REPO: ""   # e.g. "yourname/my-edition" — leave blank to skip
        run: |
          if [ -z "$EDITION_DEPLOY_TOKEN" ] || [ -z "$EDITION_REPO" ]; then
            echo "No EDITION_DEPLOY_TOKEN / EDITION_REPO — skipping public publish."; exit 0
          fi
          [ -f docs/index.html ] || { echo "No docs/index.html to publish."; exit 0; }
          rm -rf /tmp/edition
          git clone "https://x-access-token:${EDITION_DEPLOY_TOKEN}@github.com/${EDITION_REPO}.git" /tmp/edition
          cp docs/index.html /tmp/edition/index.html
          [ -f docs/archive.html ] && cp docs/archive.html /tmp/edition/archive.html
          if [ -d docs/editions ]; then
            mkdir -p /tmp/edition/editions
            cp docs/editions/*.html /tmp/edition/editions/ 2>/dev/null || true
          fi
          cd /tmp/edition
          git config user.name  "briefing-bot"
          git config user.email "briefing-bot@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || { git commit -m "Publish edition ${{ github.run_id }}"; git push; }

      # OPTIONAL: confirm the edition actually went live. GitHub Pages builds
      # occasionally stall; if the new page isn't served after ~3 minutes, push
      # an empty commit to the public edition repo to kick a rebuild. Set
      # EDITION_URL to your public site root (same value as web.edition_url in
      # config.yaml). Skips quietly when blank.
      - name: Verify web edition is live
        if: success() && !inputs.preview_to
        continue-on-error: true
        env:
          EDITION_URL: "https://khare-automations.github.io/ai_newsletter/"
          EDITION_DEPLOY_TOKEN: ${{ secrets.EDITION_DEPLOY_TOKEN }}
          EDITION_REPO: ""   # same as above; only needed to kick a rebuild
        run: |
          [ -n "$EDITION_URL" ] || { echo "No EDITION_URL — skipping check."; exit 0; }
          latest=$(ls -t docs/editions/*.html 2>/dev/null | head -1)
          [ -n "$latest" ] || { echo "No edition written this run."; exit 0; }
          url="${EDITION_URL%/}/editions/$(basename "$latest")"
          for i in 1 2 3; do
            sleep 60
            if curl -fsS -o /dev/null "$url"; then echo "Live: $url"; exit 0; fi
            echo "Not live yet ($i/3): $url"
          done
          echo "::warning::Edition not live after 3 min: $url"
          if [ -n "$EDITION_DEPLOY_TOKEN" ] && [ -n "$EDITION_REPO" ]; then
            rm -rf /tmp/rebuild
            git clone --depth 1 "https://x-access-token:${EDITION_DEPLOY_TOKEN}@github.com/${EDITION_REPO}.git" /tmp/rebuild
            cd /tmp/rebuild
            git config user.name  "briefing-bot"
            git config user.email "briefing-bot@users.noreply.github.com"
            git commit --allow-empty -m "Rebuild Pages (edition not live)"
            git push && echo "Pushed an empty commit to retrigger the Pages build."
          fi
